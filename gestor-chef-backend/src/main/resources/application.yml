spring:
  application:
    name: gestor-chef

  data:
    mongodb:
      host: ${MONGODB_HOST:localhost}
      port: ${MONGODB_PORT:27017}
      database: ${MONGODB_DATABASE:gestor_chef_runtime_db}
      auto-index-creation: true

    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

  jackson:
    default-property-inclusion: non_null

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api

app:
  jwt:
    secret: ${JWT_SECRET:gestor-chef-super-secret-key-minimum-256-bits-long-change-in-production}
    expiration: ${JWT_EXPIRATION:86400000}
    refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}

  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:4200}

  alerts:
    expiry-days: ${ALERT_EXPIRY_DAYS:7}
    stock-check-ms: ${ALERT_STOCK_MS:300000}

  whatsapp:
    enabled: ${WHATSAPP_ENABLED:false}
    token: ${WHATSAPP_TOKEN:}
    phone-number-id: ${WHATSAPP_PHONE_NUMBER_ID:}
    verify-token: ${WHATSAPP_VERIFY_TOKEN:gestor-chef-webhook-token}
    app-secret: ${WHATSAPP_APP_SECRET:}

logging:
  level:
    com.gestor.chef: DEBUG
    org.springframework.data.mongodb: INFO
    org.springframework.security: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  info:
    title: GestorChef API
    version: 1.0.0
    description: Sistema de Optimización de Inventarios para Restaurantes
